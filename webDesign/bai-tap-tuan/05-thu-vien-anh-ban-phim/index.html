<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện ảnh Đà Nẵng</title>
  <link rel="stylesheet" href="css/gallery.css">
  <script src="js/gallery.js"></script>
</head>
<body onload="addTabFocus()">
  <main>
  <h1>Thư viện ảnh Đà Nẵng</h1>

  <div id="image">Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.</div>

  <div class="list">
    <img class="preview" src="images/cau-rong.jpg" alt="Cầu Rồng phun lửa buổi tối"
         onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" src="images/cau-tran-thi-ly.jpg" alt="Hoàng hôn ở cầu Trần Thị Lý"
         onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" src="images/bien-dem.jpg" alt="Biển Đà Nẵng lúc nửa đêm"
         onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" src="images/ca-phe.jpg" alt="Một ly cà phê muối"
         onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" src="images/cho-han.jpg" alt="Bên trong chợ Hàn đông khách"
         onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" src="images/da-nang-dem.jpg" alt="Đà Nẵng về đêm nhìn từ trên núi"
         onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
  </div>
  </main>
</body>
</html>
