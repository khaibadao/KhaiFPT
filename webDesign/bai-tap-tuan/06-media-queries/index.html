<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đà Nẵng - Media Queries</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="top">
    <h1>Đà Nẵng!</h1>
    <h2>Basic Media Queries</h2>
    <p>Thu nhỏ hoặc phóng to cửa sổ trình duyệt để xem bố cục thay đổi: điện thoại 1 cột, máy tính bảng 2 cột, màn hình lớn 3 cột.</p>

    <div>
      <img src="images/cau-rong.jpg" alt="Cầu Rồng phun lửa buổi tối">
      <p>Cầu Rồng</p>
    </div>
    <div>
      <img src="images/linh-ung.jpg" alt="Tượng Quan Âm chùa Linh Ứng lúc hoàng hôn">
      <p>Chùa Linh Ứng</p>
    </div>
    <div>
      <img src="images/binh-minh-my-khe.jpg" alt="Bình minh trên biển Mỹ Khê, nhiều người tắm biển">
      <p>Biển Mỹ Khê</p>
    </div>
    <div>
      <img src="images/cau-tran-thi-ly.jpg" alt="Cầu Trần Thị Lý lúc hoàng hôn">
      <p>Cầu Trần Thị Lý</p>
    </div>
    <div>
      <img src="images/cho-han.jpg" alt="Bên trong chợ Hàn đông khách">
      <p>Chợ Hàn</p>
    </div>
    <div>
      <img src="images/bien-dem.jpg" alt="Biển ban đêm với trời đầy sao">
      <p>Biển đêm</p>
    </div>
    <div>
      <img src="images/duong-dem.jpg" alt="Con đường vắng dưới đèn đường vàng">
      <p>Đường về nhà</p>
    </div>
    <div>
      <img src="images/ca-phe.jpg" alt="Ly cà phê muối trên bàn gỗ">
      <p>Cà phê muối</p>
    </div>
    <div>
      <img src="images/da-nang-dem.jpg" alt="Thành phố Đà Nẵng về đêm nhìn từ trên núi">
      <p>Đà Nẵng về đêm</p>
    </div>

    <a href="#top">Lên đầu trang</a>
  </main>
</body>
</html>
